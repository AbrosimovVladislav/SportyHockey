<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Состав и финансы v2 — Sporty Hockey</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .scroll::-webkit-scrollbar { width: 0; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="ds-components.jsx"></script>
  <script type="text/babel">

const PLAYERS_DATA = [
  { id:1,  name:'Иван Соколов',     num:17, pos:'Нападающий',  rsvp:'going',    attended:true,  paid:1300, due:1300 },
  { id:2,  name:'Алексей Кузнецов', num:88, pos:'Нападающий',  rsvp:'going',    attended:true,  paid:700,  due:1300 },
  { id:3,  name:'Павел Белов',      num:44, pos:'Защитник',    rsvp:'going',    attended:true,  paid:0,    due:1300 },
  { id:4,  name:'Роман Ковалёв',    num:1,  pos:'Вратарь',     rsvp:'going',    attended:true,  paid:1300, due:1300 },
  { id:5,  name:'Игорь Петров',     num:18, pos:'Защитник',    rsvp:'going',    attended:true,  paid:1300, due:1300 },
  { id:6,  name:'Сергей Орлов',     num:27, pos:'Нападающий',  rsvp:'going',    attended:true,  paid:1300, due:1300 },
  { id:7,  name:'Пётр Волков',      num:81, pos:'Правый край', rsvp:'going',    attended:true,  paid:1300, due:1300 },
  { id:8,  name:'Артём Громов',     num:28, pos:'Нападающий',  rsvp:'going',    attended:true,  paid:1300, due:1300 },
  { id:9,  name:'Кирилл Зайцев',    num:9,  pos:'Центр',       rsvp:'going',    attended:true,  paid:1300, due:1300 },
  { id:10, name:'Андрей Новиков',   num:55, pos:'Защитник',    rsvp:'going',    attended:true,  paid:1300, due:1300 },
  { id:11, name:'Денис Соловьёв',   num:11, pos:'Нападающий',  rsvp:'going',    attended:true,  paid:1300, due:1300 },
  { id:12, name:'Глеб Семёнов',     num:21, pos:'Нападающий',  rsvp:'going',    attended:true,  paid:500,  due:1300 },
  { id:13, name:'Максим Тарасов',   num:13, pos:'Нападающий',  rsvp:'none',     attended:false, paid:0,    due:1300 },
  { id:14, name:'Антон Лебедев',    num:27, pos:'Левый край',  rsvp:'none',     attended:false, paid:0,    due:1300 },
  { id:15, name:'Никита Смирнов',   num:8,  pos:'Защитник',    rsvp:'none',     attended:false, paid:0,    due:1300 },
  { id:16, name:'Олег Фёдоров',     num:22, pos:'Защитник',    rsvp:'none',     attended:false, paid:0,    due:1300 },
  { id:17, name:'Илья Романов',     num:19, pos:'Нападающий',  rsvp:'none',     attended:false, paid:0,    due:1300 },
  { id:18, name:'Дмитрий Морозов',  num:71, pos:'Нападающий',  rsvp:'notGoing', attended:false, paid:0,    due:1300 },
  { id:19, name:'Егор Захаров',     num:33, pos:'Центр',       rsvp:'notGoing', attended:false, paid:0,    due:1300 },
];

const AVATAR_TONES = [
  ['#8E9AAB','#5C6B7F'], ['#B4A78F','#7A6E58'], ['#9CAFA2','#5E7269'],
  ['#A99B8E','#6E5F50'], ['#8FA0AE','#5B6A78'], ['#9C9890','#6B655B'],
];

/* ── Icons ── */
const IcPerson = ({c='#fff',s=20}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 21c.6-3.6 3.5-6 7-6 1.6 0 3.1.5 4.3 1.4"/><path d="M15.5 19.5l2 2 4-4.2"/></svg>;
const IcWallet = ({c='#fff',s=20}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7.5A2.5 2.5 0 015.5 5h12A2.5 2.5 0 0120 7.5v0H5.5A2.5 2.5 0 003 10v-2.5z"/><rect x="3" y="7.5" width="18" height="12" rx="2.5"/><path d="M11 11.5h2.2a2 2 0 010 4H11V18M11 13.5h3M9 13.5h2"/></svg>;
const IcCheck = ({c='#fff',s=14}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>;
const IcDot = ({c='#fff',s=12}) => <svg width={s} height={s} viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill={c}/></svg>;
const IcUserFill = ({c='#fff',s=12}) => <svg width={s} height={s} viewBox="0 0 24 24" fill={c}><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6H4z"/></svg>;
const IcBack = ({s=20}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg>;
const IcMore = ({s=20}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="#1C1C1E"><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/></svg>;

const fmt = (n) => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

/* ── Avatar ── */
const Avatar = ({name, idx, size=46}) => {
  const ini = name.split(' ').map(w=>w[0]).join('').slice(0,2);
  const [a,b] = AVATAR_TONES[idx % AVATAR_TONES.length];
  return (
    <div style={{
      width:size, height:size, borderRadius:'50%',
      background:`linear-gradient(135deg, ${a}, ${b})`,
      display:'flex', alignItems:'center', justifyContent:'center',
      color:'#fff', fontWeight:700, fontSize:size*0.34,
      flexShrink:0, letterSpacing:0.2,
    }}>{ini}</div>
  );
};

/* ── Action tile (Был / Сдал) ── */
const ActionTile = ({active, activeColor='#1A7A3D', icon, label, onClick}) => {
  const bg = active ? activeColor : '#fff';
  const fg = active ? '#fff' : '#C8C7C2';
  const border = active ? activeColor : '#E4E2DC';
  return (
    <div onClick={onClick} style={{
      width:50, height:50, borderRadius:12,
      background: bg, border: `1.5px solid ${border}`,
      display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
      gap:1, cursor:'pointer', transition:'all .15s', flexShrink:0,
    }}>
      {React.cloneElement(icon, { c: fg, s: 20 })}
      <div style={{fontSize:10, fontWeight:700, color: fg, fontVariantNumeric:'tabular-nums'}}>{label}</div>
    </div>
  );
};

/* ── Donut Ring ── */
const Donut = ({percent, size=100}) => {
  const stroke = 9;
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const dash = circ * (percent / 100);
  return (
    <div style={{position:'relative', width:size, height:size, flexShrink:0}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{transform:'rotate(-90deg)'}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#EFEDE7" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none"
          stroke="#1A7A3D" strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={`${dash} ${circ - dash}`}/>
      </svg>
      <div style={{position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center',
        fontSize:22, fontWeight:800, color:'#1A7A3D', fontVariantNumeric:'tabular-nums'}}>
        {percent}%
      </div>
    </div>
  );
};

/* ── Stat chip ── */
const StatChip = ({icon, color, label, value}) => (
  <div style={{flex:1, display:'flex', alignItems:'center', gap:8}}>
    <div style={{
      width:26, height:26, borderRadius:'50%', background:color, flexShrink:0,
      display:'flex', alignItems:'center', justifyContent:'center',
    }}>{icon}</div>
    <div>
      <div style={{fontSize:12, color:'#6B7280', fontWeight:500, lineHeight:1.1}}>{label}</div>
      <div style={{fontSize:16, fontWeight:800, color:'#1C1C1E', lineHeight:1.2, marginTop:1, fontVariantNumeric:'tabular-nums'}}>{value}</div>
    </div>
  </div>
);

/* ── Tab bar ── */
const TabBar = ({tabs, active, onChange}) => (
  <div style={{display:'flex', padding:'0 16px', position:'relative'}}>
    {tabs.map((t, i) => (
      <div key={t} onClick={() => onChange(i)} style={{
        flex:1, textAlign:'center', padding:'12px 0 10px',
        fontSize:13, fontWeight: i===active ? 600 : 500,
        color: i===active ? '#1A7A3D' : '#8E8E93',
        cursor:'pointer', position:'relative',
      }}>
        {t}
        {i===active && (
          <div style={{position:'absolute', left:'15%', right:'15%', bottom:0, height:2.5,
            background:'#1A7A3D', borderRadius:'3px 3px 0 0'}}/>
        )}
      </div>
    ))}
    <div style={{position:'absolute', left:0, right:0, bottom:0, height:1, background:'#F0F0F0'}}/>
  </div>
);

/* ── Player Row (flat, divider-based) ── */
const PlayerRow = ({p, idx, isLast, onAttend, onPay}) => {
  const attended = p.attended;
  let payActive = false, payColor = '#1A7A3D', payLabel = 'Сдал';
  const isPartial = p.paid > 0 && p.paid < p.due;
  if (p.paid >= p.due && attended) { payActive = true; payLabel = 'Сдал'; }
  else if (isPartial) { payActive = true; payColor = '#FF9500'; payLabel = `${fmt(p.paid)} ₽`; }

  return (
    <div>
      <div style={{
        display:'flex', alignItems:'center', gap:12,
        padding:'12px 16px',
      }}>
        <Avatar name={p.name} idx={idx} size={46}/>
        <div style={{flex:1, minWidth:0}}>
          <div style={{fontSize:15, fontWeight:700, color:'#1C1C1E', lineHeight:1.25,
            overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{p.name}</div>
          <div style={{fontSize:12, color:'#8E8E93', fontWeight:500, marginTop:2}}>
            #{p.num} · {p.pos}
          </div>
          {isPartial && false && (
            <div style={{fontSize:11, color:'#AEAEB2', fontWeight:500, marginTop:2}}>
              из {fmt(p.due)} ₽
            </div>
          )}
        </div>
        <div style={{display:'flex', gap:8, flexShrink:0}}>
          <ActionTile active={attended} icon={<IcPerson/>} label="Был" onClick={() => onAttend(p.id)}/>
          <ActionTile active={payActive} activeColor={payColor} icon={<IcWallet/>} label={payLabel} onClick={() => onPay(p.id)}/>
        </div>
      </div>
      {!isLast && <div style={{height:1, background:'#F0F0F0', marginLeft:74}}/>}
    </div>
  );
};

/* ── Group header ── */
const GroupHeader = ({title, count}) => (
  <div style={{display:'flex', alignItems:'center', gap:8, padding:'20px 16px 8px'}}>
    <span style={{fontSize:16, fontWeight:800, color:'#1C1C1E'}}>{title}</span>
    <span style={{
      display:'inline-flex', alignItems:'center', justifyContent:'center',
      minWidth:22, height:20, padding:'0 7px', borderRadius:10,
      background:'#F0F0F0', color:'#8E8E93', fontSize:12, fontWeight:700,
      fontVariantNumeric:'tabular-nums',
    }}>{count}</span>
  </div>
);

/* ════════════════════════════════
   Main Screen
   ════════════════════════════════ */
const RosterFinanceScreen = () => {
  const [players, setPlayers] = React.useState(PLAYERS_DATA);
  const [tab, setTab] = React.useState(0);

  const toggleAttend = (id) => setPlayers(ps => ps.map(p => p.id===id ? {...p, attended:!p.attended} : p));
  const togglePay = (id) => setPlayers(ps => ps.map(p => {
    if (p.id !== id) return p;
    if (p.paid === 0) return {...p, paid: p.due};
    if (p.paid >= p.due) return {...p, paid: Math.round(p.due * 0.54)};
    return {...p, paid: 0};
  }));

  const going    = players.filter(p => p.rsvp==='going');
  const none     = players.filter(p => p.rsvp==='none');
  const notGoing = players.filter(p => p.rsvp==='notGoing');
  const attended = players.filter(p => p.attended);
  const paidFull = attended.filter(p => p.paid >= p.due).length;
  const paidPart = attended.filter(p => p.paid > 0 && p.paid < p.due).length;
  const debtors  = attended.filter(p => p.paid === 0).length;
  const totalCollected = players.reduce((s,p) => s + p.paid, 0);
  const totalDue       = attended.length * 1300;
  const percent        = totalDue > 0 ? Math.round(totalCollected / totalDue * 100) : 0;

  return (
    <div style={{display:'flex', flexDirection:'column', height:'100%', background:'#fff', fontFamily:FONT}}>

      {/* Nav bar */}
      <div style={{
        display:'flex', alignItems:'center', padding:'52px 16px 8px',
        gap:12, flexShrink:0,
      }}>
        <div style={{
          width:36, height:36, borderRadius:'50%', background:'#F0F0F0',
          display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0,
        }}>
          <IcBack s={20}/>
        </div>
        <div style={{flex:1, textAlign:'center'}}>
          <div style={{fontSize:17, fontWeight:800, color:'#1C1C1E', letterSpacing:-0.3}}>Состав тренировки</div>
          <div style={{fontSize:12, color:'#8E8E93', fontWeight:500, marginTop:3}}>
            сб 24 мая · 19:30–21:00 · Ледовая Арена Север
          </div>
        </div>
        <div style={{width:36, flexShrink:0}}/>
      </div>

      {/* Tabs */}
      <TabBar tabs={['Явка и оплата','Пятёрки / команды','Статистика']} active={tab} onChange={setTab}/>

      {/* Scrollable body */}
      <div className="scroll" style={{flex:1, overflowY:'auto'}}>

        {/* Finance card */}
        <div style={{
          margin:'14px 16px 0', padding:'16px 18px 4px',
          background:'#FAFAF8', borderRadius:16,
          border:'1px solid #F0EDE6',
        }}>
          <div style={{display:'flex', alignItems:'center', gap:16}}>
            <div style={{flex:1}}>
              <div style={{fontSize:12, color:'#8E8E93', fontWeight:500}}>Взнос с игрока</div>
              <div style={{fontSize:24, fontWeight:800, color:'#1C1C1E', fontVariantNumeric:'tabular-nums', letterSpacing:-0.4, marginTop:2}}>
                1 300 ₽
              </div>
              <div style={{fontSize:12, color:'#8E8E93', fontWeight:500, marginTop:12}}>Собрано</div>
              <div style={{fontSize:24, fontWeight:800, color:'#1C1C1E', fontVariantNumeric:'tabular-nums', letterSpacing:-0.4, marginTop:2}}>
                {fmt(totalCollected)} ₽
              </div>
              <div style={{fontSize:12, color:'#AEAEB2', fontWeight:500, marginTop:3, fontVariantNumeric:'tabular-nums'}}>
                из {fmt(totalDue)} ₽
              </div>
            </div>
            <Donut percent={percent} size={110}/>
          </div>

          <div style={{height:1, background:'#EBE8E1', margin:'16px 0 0'}}/>

          <div style={{display:'flex', gap:4, padding:'14px 0'}}>
            <StatChip icon={<IcCheck c="#fff" s={13}/>} color="#1A7A3D" label="Оплатили" value={paidFull}/>
            <StatChip icon={<IcDot   c="#fff" s={10}/>} color="#FF9500" label="Частично" value={paidPart}/>
            <StatChip icon={<IcUserFill c="#fff" s={11}/>} color="#D43838" label="Должники" value={debtors}/>
          </div>
        </div>

        {/* Player groups */}
        <GroupHeader title="Записались" count={going.length}/>
        {going.map((p, i) => (
          <PlayerRow key={p.id} p={p} idx={i} isLast={i === going.length - 1}
            onAttend={toggleAttend} onPay={togglePay}/>
        ))}

        {none.length > 0 && (
          <>
            <GroupHeader title="Не ответили" count={none.length}/>
            {none.map((p, i) => (
              <PlayerRow key={p.id} p={p} idx={i+100} isLast={i === none.length - 1}
                onAttend={toggleAttend} onPay={togglePay}/>
            ))}
          </>
        )}

        {notGoing.length > 0 && (
          <>
            <GroupHeader title="Не идут" count={notGoing.length}/>
            {notGoing.map((p, i) => (
              <PlayerRow key={p.id} p={p} idx={i+200} isLast={i === notGoing.length - 1}
                onAttend={toggleAttend} onPay={togglePay}/>
            ))}
          </>
        )}

        <div style={{height:32}}/>
      </div>
    </div>
  );
};

const App = () => (
  <IOSDevice width={393} height={852} dark={false}>
    <RosterFinanceScreen/>
  </IOSDevice>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
